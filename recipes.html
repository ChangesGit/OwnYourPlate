<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <header>
        <img class = "header-icon header-icon-left" src="./assets/images/burger-menu.svg" alt="Icône menu burger">
        <img class = "mobile-logo" src="./assets/images/mobile-logo.png" alt="Logo OwnYourPlate">
        <div>
            <img class = "header-icon" src="./assets/images/language-icon.svg" alt="Icône langue">
            <img class = "header-icon header-icon-right" src="./assets/images/user-icon.svg" alt="Icône Utilisateur">
        </div>
    </header>

    <main>
        <h1>Mes recettes</h1>
        <hr>
        <section id = "search-results" class ="soft-shadow soft-border content-box"> <!--Toutes mes recettes-->
            <article class = "result-product"> <!--Une recette-->
                <div class = "name-img-flex">
                    <img src="./assets/images/Blanquette.png" alt="Image d'un produit">
                    <h3>Blanquette de veau maison</h3>
                </div>
                <div class = "text-number">
                    <p>Poids total : </p>
                    <div class = "number-box soft-border">
                        <p>560 g</p>
                    </div>
                </div>
                <div class = "text-number">
                    <p>Calories : </p>
                    <div class = "number-box soft-border">
                        <p>2200 kJ</p>
                        <p>500 kCal</p>
                    </div>
                </div>
                <div class = "text-number">
                    <p>Ajoutée le :  </p>
                    <div class = "number-box soft-border">
                        <p>26/05/2026</p>
                    </div>
                </div>
                <div class = "text-number">
                    <p>Dernières modifications : </p>
                    <div class = "number-box soft-border">
                        <p>29/05/2026</p>
                    </div>
                </div>
                <div>
                    <button class = "small-button soft-border soft-shadow">Voir</button>
                </div>
                <hr class = "box-bar">
            </article>
        </section>
    </main>

    <footer>
        <img class = "mobile-logo" src="./assets/images/mobile-logo.png" alt="Logo mobile OwnYourPlate">
        <nav>
            <ul>
                <div>
                    <a href=""><li>Mentions légales & gestion de données</li></a>
                    <a href=""><li>Notre base de données</li></a>
                </div>
                <div>
                    <a href=""><li>Nous contacter</li></a>
                    <a href=""><li>A propos</li></a>
                    <a href=""><li>FAQ</li></a>
                </div>
            </ul>
        </nav>
    </footer>
    
</body>
</html>
